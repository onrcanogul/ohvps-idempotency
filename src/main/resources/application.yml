spring:
  application:
    name: ohvps-idempotency

ohvps:
  idempotency:
    enabled: true
    request-id-header: x-request-id
    # CRC32 | MD5 | SHA256
    algorithm: SHA256
    # ÖHVPS: responses are kept for 5 minutes; after that the same request counts as a new one
    ttl: 5m
    # How long a duplicate waits for the first response while the same request is in progress
    in-flight-wait: 30s
    store-server-errors: false
    replay-indicator-header: X-Idempotency-Replayed
    cleanup-interval: 60s
    # POST endpoints where the rule is mandatory. Update the paths to match the API version.
    paths:
      - /ohvps/obh/s1.1/odeme-emri-rizasi
      - /ohvps/gkd/s1.1/erisim-belirteci
      - /ohvps/obh/s1.1/odeme-emri
      - /ohvps/hbh/s1.1/hesap-bilgisi-rizasi
      - /ohvps/obh/s1.1/ileri-tarihli-odeme-emri-rizasi
      - /ohvps/obh/s1.1/ileri-tarihli-odeme-emri
      - /ohvps/obh/s1.1/duzenli-odeme-emri-rizasi
      - /ohvps/obh/s1.1/duzenli-odeme-emri
